name: Build Miss IDE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.3'
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Create keystore
        run: |
          echo "storePassword=misside2026" > android/key.properties
          echo "keyPassword=misside2026" >> android/key.properties
          echo "keyAlias=miss-ide" >> android/key.properties
          echo "storeFile=miss-ide-key.jks" >> android/key.properties
          cp android/app/miss-ide-key.jks android/app/ 2>/dev/null || echo "Using pre-existing keystore"
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Build AAB
        run: flutter build appbundle --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: miss-ide-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: miss-ide-aab
          path: build/app/outputs/bundle/release/app-release.aab

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.3'
          channel: 'stable'
          cache: true
      
      - name: Build Web
        run: |
          cd ../miss_admin
          flutter pub get
          flutter build web --release
      
      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: miss-admin-web
          path: ../miss_admin/build/web/
