name: miss_ide
description: Mobile IDE for Android Decompilation
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ===== 状态管理 =====
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # ===== 路由管理 =====
  go_router: ^13.1.0

  # ===== 代码编辑器 =====
  re_editor: ^0.6.1
  re_highlight: ^0.0.4

  # ===== 文件管理 =====
  path_provider: ^2.1.2
  path: ^1.8.3
  file_picker: ^6.1.1
  archive: ^3.4.10
  permission_handler: ^11.2.0

  # ===== UI 组件 =====
  flutter_treeview: ^1.0.7+1
  split_view: ^3.2.1
  scrollable_positioned_list: ^0.3.8
  collection: ^1.18.0

  # ===== 工具类 =====
  xml: ^6.4.2
  uuid: ^4.3.3
  equatable: ^2.0.5
  shared_preferences: ^2.2.2

  # ===== 平台集成 =====
  android_intent_plus: ^4.0.3
  url_launcher: ^6.2.4

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/grammar/
